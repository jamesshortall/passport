version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Majors (Next, React, Sanity) get their own PRs so breaking changes are reviewed alone.

  # No `github-actions` entry: this repo has no .github/workflows, and
  # Dependabot fails the run when that ecosystem has nothing to scan.
  # Add it back alongside the first workflow file.
