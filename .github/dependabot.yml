version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Majors are intentional, reviewed migrations — not routine bumps. Ignore
    # them for the packages where a major changes config/runtime/API shape:
    #   tailwindcss 4 (new config format), eslint 10 (plugin compat),
    #   typescript 7 (new compiler), @types/node (must track the runtime, 20/22),
    #   next / react / sanity (framework upgrades done deliberately, as in #3).
    # Security advisories still produce PRs regardless of these rules.
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sanity"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sanity/vision"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next-sanity"
        update-types: ["version-update:semver-major"]

  # No `github-actions` entry: this repo has no .github/workflows, and
  # Dependabot fails the run when that ecosystem has nothing to scan.
  # Add it back alongside the first workflow file.
